name: kafka-flink-trading-demo

x-flink-image: &flink-image
  image: kafka-flink-trading-demo-flink:1.20.1
  build:
    context: ./flink

services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    command: ["/bin/sh", "/opt/start-kafka.sh"]
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null | grep -qx exchange.trades && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null | grep -qx exchange.symbol-statistics"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka/start-kafka.sh:/opt/start-kafka.sh:ro

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9092
      - --web.listen-address=0.0.0.0:9308
    ports:
      - "9308:9308"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9308/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      kafka:
        condition: service_healthy

  jobmanager:
    <<: *flink-image
    command: ["/bin/bash", "/opt/flink/usrlib/start-jobmanager.sh"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
      - ./flink/trading.sql:/opt/flink/usrlib/trading.sql:ro
      - ./flink/start-jobmanager.sh:/opt/flink/usrlib/start-jobmanager.sh:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: 0.0.0.0
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 10 s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 30 s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  taskmanager:
    <<: *flink-image
    command: taskmanager
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 10 s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 10
        restart-strategy.fixed-delay.delay: 30 s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - flink-savepoints:/opt/flink/savepoints
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9250/metrics >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-client:
    build:
      context: ./client
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INPUT_TOPIC: exchange.trades
      KAFKA_OUTPUT_TOPIC: exchange.symbol-statistics
      METRICS_PORT: 8000
    ports:
      - "8000:8000"
    command: ["produce", "--rate", "5"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      kafka-exporter:
        condition: service_healthy
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_healthy
      mock-client:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  # Web UI for whichever OLAP store OLAP_BACKEND (.env) selects.
  ui:
    build:
      context: ./ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OLAP_BACKEND: ${OLAP_BACKEND:-clickhouse}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      DRUID_URL: http://router:8888
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- ClickHouse (profile: clickhouse), Kafka engine reads exchange.symbol-statistics ----
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [clickhouse]
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/config.d/demo.xml:/etc/clickhouse-server/config.d/demo.xml:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Druid (profile: druid), Kafka supervisor reads exchange.symbol-statistics ----
  zookeeper:
    image: zookeeper:3.9.3
    profiles: [druid]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Zookeeper"]
      interval: 5s
      timeout: 5s
      retries: 20

  druid-postgres:
    image: postgres:16-alpine
    profiles: [druid]
    restart: unless-stopped
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
      POSTGRES_DB: druid
    volumes:
      - druid-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 5s
      timeout: 5s
      retries: 20

  coordinator:
    image: apache/druid:31.0.0
    profiles: [druid]
    command: coordinator
    restart: unless-stopped
    env_file: ./druid/environment
    volumes:
      - druid-shared:/opt/shared
      - druid-coordinator:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      druid-postgres:
        condition: service_healthy

  broker:
    image: apache/druid:31.0.0
    profiles: [druid]
    command: broker
    restart: unless-stopped
    env_file: ./druid/environment
    volumes:
      - druid-broker:/opt/druid/var
    depends_on:
      - coordinator

  historical:
    image: apache/druid:31.0.0
    profiles: [druid]
    command: historical
    restart: unless-stopped
    env_file: ./druid/environment
    volumes:
      - druid-shared:/opt/shared
      - druid-historical:/opt/druid/var
    depends_on:
      - coordinator

  middlemanager:
    image: apache/druid:31.0.0
    profiles: [druid]
    command: middleManager
    restart: unless-stopped
    env_file: ./druid/environment
    volumes:
      - druid-shared:/opt/shared
      - druid-middlemanager:/opt/druid/var
    depends_on:
      coordinator:
        condition: service_started
      kafka:
        condition: service_healthy

  router:
    image: apache/druid:31.0.0
    profiles: [druid]
    entrypoint: ["/bin/sh", "/spec/start-router.sh"]
    restart: unless-stopped
    env_file: ./druid/environment
    ports:
      - "8888:8888"
    volumes:
      - ./druid:/spec:ro
      - druid-router:/opt/druid/var
    depends_on:
      - coordinator
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/status/health | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  kafka-data:
  flink-checkpoints:
  flink-savepoints:
  prometheus-data:
  grafana-data:
  clickhouse-data:
  druid-metadata:
  druid-shared:
  druid-coordinator:
  druid-broker:
  druid-historical:
  druid-middlemanager:
  druid-router:
