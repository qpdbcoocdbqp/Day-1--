services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "29092:29092"
      - "8081:8081"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  pathway-app:
    image: pathwaycom/pathway:0.28.0
    container_name: pathway-app
    command: pathway spawn python realtime_regression.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    volumes: 
      - app_cache:/app
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python realtime_regression.py' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redpanda:
        condition: service_healthy

  producer:
    image: kafka-prducer:dev
    container_name: pathway-producer
    command: python generating_kafka_stream.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    volumes: 
      - app_cache:/app
    depends_on:
      redpanda:
        condition: service_healthy
      pathway-app:
        condition: service_healthy

volumes:
  app_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/src
