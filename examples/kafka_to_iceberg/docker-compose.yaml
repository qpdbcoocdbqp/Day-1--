version: "3.8"

services:
  # ===========================================================================
  # Redpanda (Kafka-compatible message broker)
  # ===========================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # MinIO (S3-compatible storage for Iceberg)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MinIO Setup (Create bucket for Iceberg)
  # ===========================================================================
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 admin password123;
        mc mb myminio/warehouse --ignore-existing;
        echo 'MinIO bucket created';
        exit 0;
      "

  # ===========================================================================
  # Iceberg REST Catalog
  # ===========================================================================
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password123
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8181' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # Pathway Pipeline (Kafka to Iceberg)
  # ===========================================================================
  pathway-pipeline:
    image: pathwaycom/pathway:latest
    container_name: pathway-pipeline
    working_dir: /app
    volumes:
      - ./kafka_to_iceberg.py:/app/kafka_to_iceberg.py:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC: events
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      PATHWAY_LICENSE_KEY: ${PATHWAY_LICENSE_KEY:-}
    command: ["python", "kafka_to_iceberg.py"]
    depends_on:
      redpanda:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy

  # ===========================================================================
  # Kafka Producer (for testing)
  # ===========================================================================
  kafka-producer:
    image: python:3.11-slim
    container_name: kafka-producer
    working_dir: /app
    volumes:
      - ./kafka_producer.py:/app/kafka_producer.py:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC: events
    command: >
      bash -c "pip install confluent-kafka && python kafka_producer.py"
    depends_on:
      redpanda:
        condition: service_healthy
    profiles:
      - producer

volumes:
  minio_data:
